name: Deploy to Vercel
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Deploy to Vercel (prebuilt)
        run: |
          npm install --global vercel@latest
          # Remove .vercel dir to avoid stale project link
          rm -rf .vercel
          # Try deploying with just the token (no scope flag - let it auto-resolve)
          vercel deploy --prod --yes \
            --name jarvis-command-center \
            --token "${{ secrets.VERCEL_TOKEN }}" \
            2>&1 || true
          # Also try amper format
          vercel --prod --yes \
            --token "${{ secrets.VERCEL_TOKEN }}" \
            2>&1 || true
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
