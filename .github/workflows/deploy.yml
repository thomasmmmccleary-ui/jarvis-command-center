name: Deploy to Vercel
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via Vercel CLI
        env:
          VTOKEN: ${{ secrets.VERCEL_TOKEN }}
          VORGID: ${{ secrets.VERCEL_ORG_ID }}
          VPROJID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          # Write auth - use shell expansion and explicit path
          VERCEL_DIR="${HOME}/.vercel"
          mkdir -p "${VERCEL_DIR}"
          AUTH_FILE="${VERCEL_DIR}/auth.json"
          cat > "${AUTH_FILE}" << AUTHEOF
          {"token":"${VTOKEN}"}
          AUTHEOF
          sed -i 's/^ *//' "${AUTH_FILE}"
          chmod 600 "${AUTH_FILE}"
          echo "Auth file written to: ${AUTH_FILE}"
          cat "${AUTH_FILE}" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Token length:', len(d.get('token',''))); print('OK' if d.get('token') else 'FAIL')"
          # Write project config
          mkdir -p .vercel
          cat > .vercel/project.json << PROJEOF
          {"projectId":"${VPROJID}","orgId":"${VORGID}"}
          PROJEOF
          sed -i 's/^ *//' .vercel/project.json
          echo "Project file:"
          cat .vercel/project.json
          # Deploy with empty VERCEL_TOKEN
          env VERCEL_TOKEN= vercel deploy --prod --yes 2>&1
