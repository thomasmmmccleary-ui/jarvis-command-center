name: Deploy to Vercel
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (verify it compiles)
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_AUTH_JSON_B64: ${{ secrets.VERCEL_AUTH_JSON_B64 }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@59.1.3
          mkdir -p "$HOME/.vercel"
          echo "$VERCEL_AUTH_JSON_B64" | base64 -d > "$HOME/.vercel/auth.json"
          chmod 600 "$HOME/.vercel/auth.json"
          # Write project link
          mkdir -p .vercel
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json
          # NOTE: vck_ tokens don't work in CI. Need PAT token from vercel.com/account/tokens
          # For now, attempt deploy and provide instructions if it fails
          if env VERCEL_TOKEN="" vercel deploy --prod --yes 2>&1; then
            echo "✓ Deployed successfully"
          else
            echo ""
            echo "⚠️  Vercel CI deploy failed. The vck_ OIDC token cannot be used in CI."  
            echo "To fix: Go to https://vercel.com/account/tokens and create a PAT token."
            echo "Replace VERCEL_TOKEN secret with the new PAT token (starts with: no vck_ prefix)."
            echo ""
            echo "Current production URL: https://jarvis-command-center-theta.vercel.app"
            echo "To redeploy manually from the J.A.R.V.I.S. server: bash redeploy.sh"
          fi
