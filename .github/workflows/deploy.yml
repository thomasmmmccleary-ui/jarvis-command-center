name: Deploy to Vercel
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Deploy to Vercel
        run: |
          npm install --global vercel@latest
          # Write auth.json so CLI uses vck_ token correctly (avoids --token flag issue)
          mkdir -p ~/.vercel
          echo "{\"token\":\"$VERCEL_TOKEN\"}" > ~/.vercel/auth.json
          # Write project.json so CLI links to existing project (avoid scope flag)
          mkdir -p .vercel
          echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json
          # Deploy - unset VERCEL_TOKEN env var so CLI reads from auth.json
          unset VERCEL_TOKEN
          vercel deploy --prod --yes 2>&1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
