name: Deploy to Vercel
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_AUTH_JSON_B64: ${{ secrets.VERCEL_AUTH_JSON_B64 }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          # Restore auth.json from base64-encoded secret
          mkdir -p "$HOME/.vercel"
          echo "$VERCEL_AUTH_JSON_B64" | base64 -d > "$HOME/.vercel/auth.json"
          chmod 600 "$HOME/.vercel/auth.json"
          echo "Auth check: $(python3 -c "import json; d=json.load(open('$HOME/.vercel/auth.json')); print('token length:', len(d.get('token','')))")"
          # Write project link
          mkdir -p .vercel
          echo "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\"}" > .vercel/project.json
          # Deploy
          env VERCEL_TOKEN="" vercel deploy --prod --yes 2>&1
