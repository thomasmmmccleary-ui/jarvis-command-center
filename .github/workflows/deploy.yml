name: Deploy to Vercel
on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Setup Vercel auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install --global vercel@latest
          mkdir -p ~/.vercel
          echo "{\"token\":\"${VERCEL_TOKEN}\"}" > ~/.vercel/auth.json
          chmod 600 ~/.vercel/auth.json

      - name: Write Vercel project config
        run: |
          mkdir -p .vercel
          echo '{"projectId":"'"${VERCEL_PROJECT_ID}"'","orgId":"'"${VERCEL_ORG_ID}"'"}' > .vercel/project.json

      - name: Deploy to Vercel
        run: |
          vercel deploy --prod --yes 2>&1
